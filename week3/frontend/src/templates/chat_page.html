<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Resume Helper Chatbot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <style>
        #chat-history {
            height: 60vh;
            overflow-y: auto;
            border: 1px solid #dee2e6;
            background-color: #f8f9fa;
        }
    </style>
</head>

<body class="bg-light">

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">Resume Helper Chatbot</h5>
                    </div>

                    <div id="chat-history" class="card-body p-3 mb-3 rounded">
                        <div class="text-muted text-center my-5">Chat history is empty. Start typing below!</div>
                    </div>

                    <div class="card-footer bg-white">
                        <form id="chat-form">
                            <div class="mb-2">
                                <label for="pdf-file" class="form-label small text-muted fw-bold">Upload Resume
                                    (PDF):</label>
                                <input class="form-control form-control-sm" type="file" id="pdf-file" accept=".pdf">
                            </div>
                            <div class="input-group">
                                <input type="text" id="user-input" class="form-control"
                                    placeholder="Ask a question about your resume..." required>
                                <button class="btn btn-primary" type="submit" id="send-btn">Send</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const BACKEND_URL = "{{ backend_url }}";
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

        // Helper function to extract text from PDF file objects client-side
        async function extractTextFromPDF(file) {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            let fullText = "";
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                const pageText = textContent.items.map(item => item.str).join(" ");
                fullText += pageText + "\n";
            }
            return fullText.trim();
        }

        // Intercept Form Submission
        document.getElementById('chat-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const userInputField = document.getElementById('user-input');
            const fileInputField = document.getElementById('pdf-file');
            const chatHistory = document.getElementById('chat-history');

            const messageText = userInputField.value.trim();
            const file = fileInputField.files[0];
            let extractedPdfText = "";

            if (!messageText) return;

            // Clear placeholder text if it's the first message
            if (chatHistory.querySelector('.text-muted')) {
                chatHistory.innerHTML = '';
            }

            // Append User Message to UI instantly
            chatHistory.innerHTML += `<div class="text-end mb-2"><span class="bg-primary text-white d-inline-block p-2 rounded">${messageText}</span></div>`;
            userInputField.value = "";
            fileInputField.value = ""; // Clear file input after submission

            // Handle PDF extraction if present
            if (file) {
                try {
                    chatHistory.innerHTML += `<div class="text-end mb-2"><small class="text-muted d-block">Reading ${file.name}...</small></div>`;
                    extractedPdfText = await extractTextFromPDF(file);
                } catch (error) {
                    console.error("PDF Parsing failed:", error);
                    chatHistory.innerHTML += `<div class="text-danger mb-2"><small>Error processing PDF file.</small></div>`;
                }
            }

            // Auto-scroll chat window downward
            chatHistory.scrollTop = chatHistory.scrollHeight;

            // Build JSON Payload matching requirements
            const payload = {
                message: messageText,
                pdf_text: extractedPdfText
            };

            // Post to backend asynchronous target endpoint
            try {
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                // Append Server Response to UI (Day 3 target handler preview)
                chatHistory.innerHTML += `<div class="text-start mb-2"><span class="bg-secondary text-white d-inline-block p-2 rounded">${data.reply || 'Message processed by backend.'}</span></div>`;
            } catch (err) {
                console.error("Failed to connect to backend engine:", err);
                chatHistory.innerHTML += `<div class="text-start mb-2"><span class="bg-danger text-white d-inline-block p-2 rounded">Error: Unable to connect to backend server.</span></div>`;
            }

            chatHistory.scrollTop = chatHistory.scrollHeight;
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
